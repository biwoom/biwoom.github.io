<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수메다와 수밋따의 만남 · 비움 이야기카드</title>
<style>
body { margin: 0; background: #eae9e5; }
main { max-width: 1120px; margin-inline: auto; padding: clamp(14px, 4vw, 48px); }
.biwoom-card-frame {
  container: biwoom-card / inline-size;
  min-width: 0;
}

.biwoom-card-frame .story-card {
  --card-paper: #fdfbf7;
  --card-ink: #252520;
  --card-muted: #66645b;
  --card-gold: #8d6a37;
  --card-border: #ded9cd;
  --card-font: Pretendard, "Noto Sans CJK KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --card-serif: "Noto Serif KR", "Noto Serif CJK KR", Batang, serif;
  box-sizing: border-box;
  color-scheme: light;
  color: var(--card-ink);
  background: var(--card-paper);
  border: 1px solid var(--card-border);
  box-shadow: 0 7px 23px #24201b12;
  position: relative;
  isolation: isolate;
  min-height: 56.25cqw;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  grid-template-areas: "meta meta" "copy art" "credit credit";
  grid-template-rows: auto 1fr auto;
  align-items: center;
  gap: 0 2cqw;
  padding: 4.7cqw 5.3cqw 4.45cqw;
  font: 1rem/1.5 var(--card-font);
  word-break: keep-all;
  overflow-wrap: anywhere;
}

.biwoom-card-frame .story-card::after {
  content: "";
  position: absolute;
  inset: 2.65cqw;
  border: 1px solid var(--card-border);
  pointer-events: none;
  z-index: -1;
}

.biwoom-card-frame .story-card-art-left {
  --card-paper: #fffdf9;
  grid-template-areas: "meta meta" "art copy" "credit credit";
}

.biwoom-card-frame :is(.story-card-meta, .story-card-credit) {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: baseline;
  gap: 4px 12px;
  color: var(--card-muted);
  font-size: max(.75rem, 1.06cqw);
}

.biwoom-card-frame .story-card-meta { grid-area: meta; font-weight: 650; letter-spacing: .08em; }
.biwoom-card-frame .story-card-brand { color: var(--card-ink); font-size: max(.88rem, 1.55cqw); letter-spacing: -.04em; }
.biwoom-card-frame .story-card-credit { grid-area: credit; }
.biwoom-card-frame .story-card-credit a { color: inherit; text-underline-offset: .16em; }
.biwoom-card-frame .story-card a:focus-visible { outline: 2px solid var(--card-gold); outline-offset: 3px; }
.biwoom-card-frame .story-card-art-left .story-card-caption { order: -1; }

.biwoom-card-frame .story-card-copy { grid-area: copy; padding: 2.5cqw 0 2.5cqw 1.9cqw; z-index: 1; }
.biwoom-card-frame .story-card-art-left .story-card-copy { padding-inline: 1cqw 1.6cqw; }
.biwoom-card-frame .story-card-kicker { margin: 0 0 1.1cqw; color: var(--card-gold); font-size: max(.75rem, 1.14cqw); font-weight: 650; letter-spacing: .1em; }
.biwoom-card-frame .story-card-title { margin: 0; color: var(--card-ink); font: 720 max(1.75rem, 4.45cqw)/1.25 var(--card-font); letter-spacing: -.062em; }
.biwoom-card-frame .story-card-body { margin: 1.45cqw 0 0; color: #3f3c35; font: max(1rem, 1.65cqw)/1.85 var(--card-serif); letter-spacing: -.025em; }
.biwoom-card-frame .story-card-body::before { content: ""; display: block; width: 2.1em; height: 1px; margin-bottom: 1em; background: var(--card-gold); }
.biwoom-card-frame .story-card-reflection { margin: 1em 0 0; color: var(--card-gold); font-size: max(.88rem, 1.28cqw); font-weight: 600; line-height: 1.65; }

.biwoom-card-frame .story-card-art {
  grid-area: art;
  position: relative;
  display: grid;
  place-items: center;
  align-self: stretch;
  min-height: 36cqw;
  margin: 0;
}

.biwoom-card-frame .story-card-art::before {
  content: "";
  position: absolute;
  inset: 9% 8% 8%;
  border-radius: 50%;
  background: #f3ede1;
}

.biwoom-card-frame .story-card-art img {
  display: block;
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center bottom;
}

.biwoom-card-frame .story-card-art-pair .story-card-art-primary { width: 57%; height: 80%; right: 0; top: 0; }
.biwoom-card-frame .story-card-art-pair .story-card-art-secondary { width: 64%; height: 71%; left: 0; bottom: 0; }

@container biwoom-card (max-width: 620px) {
  .biwoom-card-frame .story-card {
    grid-template: "meta" "art" "copy" "credit" / minmax(0, 1fr);
    gap: 12px;
    min-height: 0;
    padding: 6cqw 7cqw;
  }
  .biwoom-card-frame .story-card::after { inset: 3.5cqw; }
  .biwoom-card-frame .story-card-art { min-height: 59cqw; }
  .biwoom-card-frame .story-card-art::before { inset-inline: 16%; }
  .biwoom-card-frame .story-card-art:not(.story-card-art-pair) img { width: 72%; }
  .biwoom-card-frame .story-card-art-left .story-card-copy,
  .biwoom-card-frame .story-card-copy { padding: 0 0 6px; }
  .biwoom-card-frame .story-card-title { font-size: max(1.5rem, 7cqw); }
  .biwoom-card-frame .story-card-title br { display: none; }
  .biwoom-card-frame .story-card-body { margin-top: 12px; }
}

@media print {
  .biwoom-card-frame .story-card {
    box-shadow: none;
    break-inside: avoid;
    print-color-adjust: exact;
  }
}
</style>

<div class="story-card-copy"><p class="story-card-kicker">인연 · ENCOUNTER</p><h2 class="story-card-title" id="meeting-title">수메다와<br> 수밋따의 만남</h2><p class="story-card-body">수밋따는 연등불께 올리려던 여덟 송이의 연꽃 가운데 다섯 송이를 수메다에게 건넸다. 그리고 그가 깨달음을 이루는 오랜 여정에 함께하기를 서원했다.</p><p class="story-card-reflection">꽃을 나누는 일이, 서원을 나누는 일이 되었다.</p></div>
